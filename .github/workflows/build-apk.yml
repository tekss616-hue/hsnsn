name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cinematic media assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/media app/src/main/assets/hq
          mv "app/src/main/res/values/wren-hotel-intro-landscape.png" app/src/main/assets/media/hotel-landscape.png
          mv "app/src/main/res/values/wren-hotel-intro-portrait.png" app/src/main/assets/media/hotel-portrait.png
          mv "app/src/main/res/values/wren-hotel-corridor-landscape.png" app/src/main/assets/media/corridor-landscape.png
          mv "app/src/main/res/values/wren-hotel-corridor-portrait.png" app/src/main/assets/media/corridor-portrait.png
          mv "app/src/main/res/values/wren-hotel-crime-scene-landscape.png" app/src/main/assets/media/crime-landscape.png
          mv "app/src/main/res/values/wren-hotel-crime-scene-portrait.png" app/src/main/assets/media/crime-portrait.png
          mv "app/src/main/res/values/wren-hotel-suspects-desk-landscape.png" app/src/main/assets/media/desk-landscape.png
          mv "app/src/main/res/values/wren-hotel-suspects-desk-portrait.png" app/src/main/assets/media/desk-portrait.png
          mv "app/src/main/res/values/closed-investigator-envelope.png" app/src/main/assets/media/envelope-closed.png
          mv "app/src/main/res/values/open-investigator-envelope.png" app/src/main/assets/media/envelope-open.png
          mv "app/src/main/res/values/investigator-identity-paper.png" app/src/main/assets/media/investigator-paper.png
          mv "app/src/main/res/values/mixkit-light-rain-loop-2393.wav" app/src/main/assets/media/rain.wav
          mv "app/src/main/res/values/muffled-impact-single.wav" app/src/main/assets/media/impact.wav
          mv "app/src/main/res/values/Police Siren (Distant) - Sound Effect _ ProSounds.mp3" app/src/main/assets/media/police.mp3
          mv "app/src/main/res/values/Cinematic Boom - sound effect - [High quality].mp3" app/src/main/assets/media/boom.mp3
          unzip -o app/src/main/assets/investigator-hq-responsive-pack.zip -d app/src/main/assets/hq

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Print signing report
        run: gradle signingReport

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: action-template-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
