name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media optimizers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil

      - name: Prepare optimized runtime assets
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/veilmark-src
          mkdir -p "$SRC" app/src/main/assets/media
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path('branding/game-identity.webp.b64')
          dst = Path('app/src/main/assets/media/game-identity.webp')
          data = ''.join(src.read_text(encoding='utf-8').split())
          data += '=' * (-len(data) % 4)
          dst.write_bytes(base64.b64decode(data, validate=False))
          PY
          python3 tools/apply_account_social_patch.py
          python3 tools/apply_auth_persistence_patch.py
          python3 tools/apply_search_response_query.py
          python3 tools/apply_native_app_polish.py
          python3 tools/apply_legacy_username_conflict_ui.py
          python3 tools/apply_realtime_social_patch.py
          python3 tools/fix_realtime_chat_watch.py
          python3 tools/apply_delete_reauth_patch.py
          python3 tools/apply_puzzle_race.py
          sed -i 's#<link rel="stylesheet" href="social.css">#<link rel="stylesheet" href="social.css"><link rel="stylesheet" href="identity.css">#' app/src/main/assets/index.html

          mv "app/src/main/assets/Wren-Hotel-Intro-Vertical-Final.mp4" "$SRC/intro.mp4"
          rm -f app/src/main/assets/intro-vertical-final.mp4
          mv "app/src/main/res/values/wren-hotel-intro-landscape.png" "$SRC/hotel-landscape.png"
          mv "app/src/main/res/values/wren-hotel-intro-portrait.png" "$SRC/hotel-portrait.png"
          mv "app/src/main/res/values/wren-hotel-corridor-landscape.png" "$SRC/corridor-landscape.png"
          mv "app/src/main/res/values/wren-hotel-corridor-portrait.png" "$SRC/corridor-portrait.png"
          mv "app/src/main/res/values/wren-hotel-crime-scene-landscape.png" "$SRC/crime-landscape.png"
          mv "app/src/main/res/values/wren-hotel-crime-scene-portrait.png" "$SRC/crime-portrait.png"
          mv "app/src/main/res/values/wren-hotel-suspects-desk-landscape.png" "$SRC/desk-landscape.png"
          mv "app/src/main/res/values/wren-hotel-suspects-desk-portrait.png" "$SRC/desk-portrait.png"
          mv "app/src/main/res/values/closed-investigator-envelope.png" "$SRC/envelope-closed.png"
          mv "app/src/main/res/values/open-investigator-envelope.png" "$SRC/envelope-open.png"
          mv "app/src/main/res/values/investigator-identity-paper.png" "$SRC/investigator-paper.png"
          mv "app/src/main/res/values/mixkit-light-rain-loop-2393.wav" "$SRC/rain.wav"
          mv "app/src/main/res/values/muffled-impact-single.wav" "$SRC/impact.wav"
          mv "app/src/main/res/values/Police Siren (Distant) - Sound Effect _ ProSounds.mp3" "$SRC/police.mp3"
          mv "app/src/main/res/values/Cinematic Boom - sound effect - [High quality].mp3" "$SRC/boom.mp3"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('/tmp/veilmark-src'); media=Path('app/src/main/assets/media')
          def webp(source,dest,max_size=None,quality=82):
              im=Image.open(source)
              if max_size: im.thumbnail(max_size,Image.Resampling.LANCZOS)
              im.save(dest,'WEBP',quality=quality,method=5)
          webp(src/'envelope-closed.png',media/'envelope-closed.webp',(1024,1024),84)
          webp(src/'envelope-open.png',media/'envelope-open.webp',(1024,1024),84)
          poster=Image.open(src/'hotel-portrait.png').convert('RGB').resize((540,960),Image.Resampling.LANCZOS)
          poster.save(media/'intro-poster.webp','WEBP',quality=80,method=5)
          PY

          ffmpeg -y -hide_banner -loglevel error -i "$SRC/intro.mp4" -vf "scale=720:1280:flags=lanczos,fps=30" -c:v libx264 -preset medium -crf 24 -profile:v high -level 4.0 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart app/src/main/assets/intro-runtime.mp4
          rm -rf app/src/main/assets/hq
          rm -f app/src/main/assets/investigator-hq-responsive-pack.zip app/src/main/assets/media/investigator-paper.webp

      - name: Verify identity, realtime social and puzzle race
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/social.js
          grep -q 'AUTH_PROFILE_SEP' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'claimProfileDocs' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'USERNAME_TAKEN' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'rollbackNewAccount' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'collection("usernames").document(q)' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'out.put("query",q)' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'removeFriend' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'startRealtime' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'watchChat' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'stopChatWatch' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'setTyping' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'showNativeNotification' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'reauthenticatePasswordAndDelete' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'googleReauthAndDelete' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'data-remove' app/src/main/assets/social.js
          grep -q 'onNativeRealtimeEvent' app/src/main/assets/social.js
          grep -q 'requestDeletePassword' app/src/main/assets/app.js
          grep -q 'id="appDialog"' app/src/main/assets/index.html
          grep -q 'function showAppDialog' app/src/main/assets/app.js
          grep -q 'search-spinner' app/src/main/assets/social.css
          grep -q 'user-select:none' app/src/main/assets/styles.css
          grep -q 'id="puzzleGame"' app/src/main/assets/index.html
          grep -q 'startPuzzleMatch' app/src/main/assets/app.js
          grep -q 'onNativePuzzleEvent' app/src/main/assets/app.js
          grep -q 'new PuzzleBridge(), "NativePuzzle"' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'public class PuzzleBridge' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'members.size()>=7' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'stage1Chat' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java || grep -q '"stage"+stage+"Chat"' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          test -f app/src/main/assets/puzzle-1.svg
          test -f app/src/main/assets/puzzle-6.svg
          ! grep -q 'encodedDisplayName' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          ! grep -q 'confirm(' app/src/main/assets/app.js
          ! grep -q 'confirm(' app/src/main/assets/social.js
          ! grep -q 'alert(' app/src/main/assets/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: veilmark-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Print signing report
        run: gradle signingReport

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: action-template-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
