name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install media optimizers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
      - name: Prepare optimized runtime assets
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/veilmark-src
          mkdir -p "$SRC" app/src/main/assets/media
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src=Path('branding/game-identity.webp.b64'); dst=Path('app/src/main/assets/media/game-identity.webp')
          data=''.join(src.read_text(encoding='utf-8').split()); data+='='*(-len(data)%4); dst.write_bytes(base64.b64decode(data,validate=False))
          PY
          python3 tools/apply_account_social_patch.py
          python3 tools/apply_auth_persistence_patch.py
          python3 tools/apply_search_response_query.py
          python3 tools/apply_native_app_polish.py
          python3 tools/apply_legacy_username_conflict_ui.py
          python3 tools/apply_realtime_social_patch.py
          python3 tools/fix_realtime_chat_watch.py
          python3 tools/apply_delete_reauth_patch.py
          python3 tools/apply_puzzle_race.py
          python3 tools/apply_custom_match_emblem.py
          python3 tools/apply_in_app_updater.py
          python3 tools/apply_gameplay_social_upgrade.py
          python3 tools/fix_gameplay_startup_dialog.py
          python3 tools/apply_nav_startup_fix.py
          python3 tools/apply_settings_social_language_fix.py
          python3 tools/fix_typing_indicator_timeout.py
          python3 tools/apply_remaining_round_fixes.py
          python3 tools/fix_admin_panel_visibility.py
          python3 tools/apply_world_first_batch.py
          python3 tools/apply_real_preview_nader.py
          python3 tools/remove_intro.py
          python3 tools/apply_roleplay_copy_cleanup.py
          sed -i 's#<link rel="stylesheet" href="social.css">#<link rel="stylesheet" href="social.css"><link rel="stylesheet" href="identity.css">#' app/src/main/assets/index.html
          rm -f app/src/main/assets/Wren-Hotel-Intro-Vertical-Final.mp4 app/src/main/assets/intro-vertical-final.mp4 app/src/main/assets/intro-runtime.mp4 app/src/main/assets/media/intro-poster.webp
          mv "app/src/main/res/values/wren-hotel-intro-landscape.png" "$SRC/hotel-landscape.png"
          mv "app/src/main/res/values/wren-hotel-intro-portrait.png" "$SRC/hotel-portrait.png"
          mv "app/src/main/res/values/wren-hotel-corridor-landscape.png" "$SRC/corridor-landscape.png"
          mv "app/src/main/res/values/wren-hotel-corridor-portrait.png" "$SRC/corridor-portrait.png"
          mv "app/src/main/res/values/wren-hotel-crime-scene-landscape.png" "$SRC/crime-landscape.png"
          mv "app/src/main/res/values/wren-hotel-crime-scene-portrait.png" "$SRC/crime-portrait.png"
          mv "app/src/main/res/values/wren-hotel-suspects-desk-landscape.png" "$SRC/desk-landscape.png"
          mv "app/src/main/res/values/wren-hotel-suspects-desk-portrait.png" "$SRC/desk-portrait.png"
          mv "app/src/main/res/values/closed-investigator-envelope.png" "$SRC/envelope-closed.png"
          mv "app/src/main/res/values/open-investigator-envelope.png" "$SRC/envelope-open.png"
          mv "app/src/main/res/values/investigator-identity-paper.png" "$SRC/investigator-paper.png"
          mv "app/src/main/res/values/mixkit-light-rain-loop-2393.wav" "$SRC/rain.wav"
          mv "app/src/main/res/values/muffled-impact-single.wav" "$SRC/impact.wav"
          mv "app/src/main/res/values/Police Siren (Distant) - Sound Effect _ ProSounds.mp3" "$SRC/police.mp3"
          mv "app/src/main/res/values/Cinematic Boom - sound effect - [High quality].mp3" "$SRC/boom.mp3"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('/tmp/veilmark-src'); media=Path('app/src/main/assets/media')
          def webp(source,dest,max_size=None,quality=82):
              im=Image.open(source)
              if max_size: im.thumbnail(max_size,Image.Resampling.LANCZOS)
              im.save(dest,'WEBP',quality=quality,method=5)
          webp(src/'envelope-closed.png',media/'envelope-closed.webp',(1024,1024),84)
          webp(src/'envelope-open.png',media/'envelope-open.webp',(1024,1024),84)
          PY
          rm -rf app/src/main/assets/hq
          rm -f app/src/main/assets/investigator-hq-responsive-pack.zip app/src/main/assets/media/investigator-paper.webp
      - name: Verify identity, realtime social, puzzle race, world and updater
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/social.js
          grep -q 'AUTH_PROFILE_SEP' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'claimProfileDocs' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'USERNAME_TAKEN' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'rollbackNewAccount' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'collection("usernames").document(q)' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'removeFriend' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'startRealtime' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'watchChat' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'setTyping' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'reauthenticatePasswordAndDelete' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'data-remove' app/src/main/assets/social.js
          grep -q 'GAMEPLAY_SOCIAL_UPGRADE' app/src/main/assets/social.js
          grep -q 'SETTINGS_SOCIAL_LANGUAGE_FIX' app/src/main/assets/social.js
          grep -q 'REMAINING_ROUND_FIXES' app/src/main/assets/social.js
          grep -q 'ADMIN_PANEL_VISIBILITY_FIX' app/src/main/assets/social.js
          grep -q 'SOCIAL_WORLD_V2' app/src/main/assets/social.js
          grep -q 'REAL_PREVIEW_NADER_V1' app/src/main/assets/social.js
          ! grep -q 'function naderReplyFor' app/src/main/assets/social.js
          grep -q '/api/admin/nader/chat' app/src/main/assets/social.js
          grep -q 'id="worldGame"' app/src/main/assets/index.html
          grep -q 'نادر يكتب' app/src/main/assets/social.js
          grep -q 'social-world-v2' app/src/main/assets/social.css
          grep -q 'isAdminAccount' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'typingStopTimer' app/src/main/assets/social.js
          grep -q 'setTimeout(stopLocalTyping,1000)' app/src/main/assets/social.js
          grep -q 'id="adminPreviewMode"' app/src/main/assets/index.html
          grep -q 'stable-four-item-main-nav' app/src/main/assets/social.css
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' app/src/main/assets/social.css
          grep -q 'settingsHomeBack' app/src/main/assets/index.html
          grep -q 'privacyPanel' app/src/main/assets/index.html
          grep -q 'chatSettingsPanel' app/src/main/assets/index.html
          grep -q 'languagePanel' app/src/main/assets/index.html
          grep -q 'chatActionSheet' app/src/main/assets/index.html
          grep -q 'loadBlockedUsers' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'unblockUser' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'notifications_enabled' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'setTextZoom(100)' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q "if(r)r.hidden=true;if(st)st.hidden=true;window.showHQ" app/src/main/assets/social.js
          grep -q 'id="gameStore"' app/src/main/assets/index.html
          grep -q 'id="rankingView"' app/src/main/assets/index.html
          grep -q 'id="storeTab"' app/src/main/assets/index.html
          grep -q 'id="rankingTab"' app/src/main/assets/index.html
          grep -q '>المتجر<' app/src/main/assets/index.html
          grep -q '>التصنيف<' app/src/main/assets/index.html
          ! grep -Eq 'محقق|التحقيق|القضايا|قضية' app/src/main/assets/index.html app/src/main/assets/app.js app/src/main/assets/social.js
          grep -q 'adminPanelBtn' app/src/main/assets/index.html
          grep -q 'investigatorCard' app/src/main/assets/index.html
          grep -q 'id="appDialog"' app/src/main/assets/index.html
          grep -q 'id="appDialogCancel"' app/src/main/assets/index.html
          grep -q 'id="appDialogOk"' app/src/main/assets/index.html
          grep -q 'id="puzzleGame"' app/src/main/assets/index.html
          grep -q 'startPuzzleMatch' app/src/main/assets/app.js
          grep -q 'new PuzzleBridge(), "NativePuzzle"' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'members.size()>=7' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          test -f app/src/main/assets/puzzle-1.svg
          test -f app/src/main/assets/puzzle-6.svg
          test -f app/src/main/assets/media/investigation-match-emblem.webp
          grep -q 'match-emblem-inline' app/src/main/assets/app.js
          grep -q 'LATEST_RELEASE_API' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'beginUpdateDownload' app/src/main/java/com/hsnsn/actiontemplate/MainActivity.java
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          ! grep -q '<video id="introVideo"' app/src/main/assets/index.html
          ! grep -q 'id="quickSplash"' app/src/main/assets/index.html
          ! grep -q 'splash.hidden=false' app/src/main/assets/app.js
          ! test -f app/src/main/assets/intro-runtime.mp4
          ! grep -q 'confirm(' app/src/main/assets/app.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: veilmark-android-debug-keystore-v1
      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias AndroidDebugKey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stamp build version
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '1.0.${GITHUB_RUN_NUMBER}'/" app/build.gradle
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" app/build.gradle
      - name: Print signing report
        run: gradle signingReport
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: action-template-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish successful APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK#app-debug.apk" --title "Build ${GITHUB_RUN_NUMBER}" --notes "Automatic successful APK build ${GITHUB_RUN_NUMBER}."
