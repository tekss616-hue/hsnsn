<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d12" />
  <title>قوالب | Template Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">مكتبة القوالب</span>
        <h1>اختَر نوع المونتاج</h1>
        <p>قوالب جاهزة مرتبة حسب نوع المحتوى، بشكل سريع وواضح.</p>
      </div>
      <button class="icon-btn" id="themeButton" aria-label="تبديل المظهر">◐</button>
    </header>

    <section class="search-wrap" aria-label="البحث">
      <input id="searchInput" type="search" placeholder="ابحث عن قسم..." autocomplete="off" />
    </section>

    <section class="category-grid" id="categoryGrid" aria-live="polite"></section>

    <section class="panel" id="categoryPanel" hidden>
      <div class="panel-head">
        <div>
          <span class="eyebrow">القسم المختار</span>
          <h2 id="panelTitle"></h2>
        </div>
        <button class="ghost-btn" id="closePanel">رجوع</button>
      </div>
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <h3>القوالب بتنزل هنا</h3>
        <p>هذه أول دفعة من التطبيق. في الدفعة الجاية نبدأ نضيف القوالب الفعلية داخل كل قسم.</p>
      </div>
    </section>

    <footer>
      <span>hsnsn</span>
      <span>v0.1</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
