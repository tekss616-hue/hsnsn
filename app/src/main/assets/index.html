<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Investigation</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="onboarding.css">
</head><body>
<main id="intro" class="intro" aria-label="مقدمة اللعبة"><video id="introVideo" class="intro-video" src="intro-runtime.mp4" poster="media/intro-poster.webp" preload="metadata" autoplay playsinline webkit-playsinline disablepictureinpicture></video><div class="cinematic-vignette"></div><button id="skipIntro" class="skip">تخطي</button><button id="resumeIntro" class="resume-intro" hidden>اضغط لتشغيل المقدمة</button></main>
<main id="quickSplash" class="quick-splash" hidden><div class="splash-mark">◈</div><div>قسم التحقيق</div></main>
<main id="envelopeScreen" class="envelope-screen" hidden><div class="desk-light"></div><div class="envelope-copy"><h1>لديك رسالة سرية</h1><p>اضغط على الظرف لفتح ملفك.</p></div><button id="envelope" class="image-envelope"><img class="envelope-closed" src="media/envelope-closed.webp" decoding="async"><img class="envelope-open" src="media/envelope-open.webp" decoding="async"></button></main>
<main id="profile" class="profile" hidden><div class="auth-atmosphere" aria-hidden="true"><i></i><i></i><i></i></div><div class="identity-paper"><div class="identity-form"><h1>إنشاء هوية المحقق</h1><p>اسم المحقق فقط هو الذي يظهر للاعبين.</p><label>اسم المحقق<input id="playerName" maxlength="24" placeholder="الاسم الذي سيراه اللاعبون"></label><label>البريد الإلكتروني<input id="playerEmail" type="email" autocomplete="email" inputmode="email" placeholder="البريد الإلكتروني"></label><label>كلمة المرور<input id="playerPassword" type="password" minlength="8" autocomplete="current-password" placeholder="8 أحرف على الأقل"></label><label>تأكيد كلمة المرور<input id="playerPasswordConfirm" type="password" minlength="8" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور"></label><div id="formError" class="form-error"></div><button id="createProfile" class="primary">اعتماد هويتي</button><div class="or"><span>أو</span></div><button id="googleAuth" class="google-auth"><b>G</b> المتابعة باستخدام Google</button><button id="existingAccount" class="existing">لدي هوية بالفعل — تسجيل الدخول</button></div></div></main>
<main id="hq" class="hq" data-case-view="free" hidden><div class="hq-dynamic-bg" aria-hidden="true"><div class="hq-grid-lines"></div><div class="hq-glow hq-glow-red"></div><div class="hq-glow hq-glow-blue"></div><div class="hq-scan"></div><div class="hq-noise"></div></div><div class="hq-shade"></div><header class="hq-top"><div><small>قسم التحقيق</small><strong id="hqName">المحقق</strong></div><button id="hqSettings" class="icon-btn">⚙</button></header><div class="case-tabs" aria-label="نوع القضايا"><button class="case-tab active free-tab" data-view="free"><b>القضايا المجانية</b><small>حتى 6 لاعبين</small></button><button class="case-tab premium-tab" data-view="premium"><b>القضايا الخاصة</b><small>حتى 10 لاعبين</small></button></div><section class="case-zone"><div class="case-column free"><div class="case-heading"><span>القضايا المجانية</span><small>حتى 6 لاعبين</small></div><div id="freeCases" class="case-grid"></div></div><div class="case-column premium"><div class="case-heading"><span>القضايا الخاصة</span><small>حتى 10 لاعبين</small></div><div id="premiumCases" class="case-grid"></div></div></section><nav class="hq-nav"><button class="active">القضايا</button><button>الملف</button><button>التصنيف</button></nav></main>
<div id="settingsSheet" class="settings-sheet" hidden><div class="settings-card"><button id="closeSettings" class="close">×</button><h2>الإعدادات</h2><button id="replayIntro" class="setting-action">إعادة مشاهدة المقدمة السينمائية</button></div></div>
<script src="app.js"></script></body></html>
